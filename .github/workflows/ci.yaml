name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.ref_name == 'main' && github.run_id || 'pr' }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  integration-test:
    name: Integration (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Standard public-repository runners avoid metered larger runners.
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          # A cold fetch from the public repositories is the evidence.
          bazelisk-cache: false
          disk-cache: false
          repository-cache: false
          cache-save: false
      - name: Module suites
        run: bazel test //... --test_output=errors
      - name: Locks and module files the fetch refuses
        run: python3 tools/check_rejections.py
      - name: Independent consumer
        working-directory: examples/consumer
        run: bazel test //... --test_output=errors
      - name: Verify a prepared release archive
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: python3 tools/prepare_release.py "$RELEASE_TAG" > "$RUNNER_TEMP/release-notes.md"

  gradle-offline-test:
    name: Gradle offline (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          # renovate: datasource=java-version depName=java-jdk
          java-version: "21.0.13"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # renovate: datasource=gradle-version depName=gradle
          gradle-version: "9.8.2"
          # The check gives Gradle a fresh user home, so a cache would hold
          # nothing it reads.
          cache-disabled: true
      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          bazelisk-cache: false
          disk-cache: false
          repository-cache: false
          cache-save: false
      - name: Gradle resolves offline from the layout, and only from it
        run: python3 tools/check_gradle.py

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install the pinned tools
        run: python -m pip install -r requirements-dev.txt
      - name: mypy (strict)
        run: mypy

  baseline:
    # The checks every Curlew Labs repository runs, in one place:
    # https://github.com/curlewlabs-com/ci-baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: curlewlabs-com/ci-baseline@bfb113336d98bcaad9408e021566d985ecf51bde # v0.3.3

  conclusion:
    needs: [integration-test, gradle-offline-test, lint, baseline]
    runs-on: ubuntu-24.04
    if: always()
    steps:
      - name: Require every integration, Gradle and lint job to pass
        env:
          INTEGRATION: ${{ needs.integration-test.result }}
          GRADLE: ${{ needs.gradle-offline-test.result }}
          LINT: ${{ needs.lint.result }}
          BASELINE: ${{ needs.baseline.result }}
        run: test "$INTEGRATION" = success && test "$GRADLE" = success && test "$LINT" = success && test "$BASELINE" = success
